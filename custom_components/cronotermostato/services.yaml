create_program:
  fields:
    name:
      required: true
      example: "Casa"
      selector:
        text:
    week:
      required: true
      example: '[[{"start": "07:00", "end": "22:00", "mode": "heat", "temperature": 20.5}, {"start": "22:00", "end": "24:00", "mode": "heat", "preset": "sleep"}], [], [], [], [], [], []]'
      selector:
        object:
    holiday:
      required: true
      example: '[{"start": "08:00", "end": "23:00", "mode": "heat", "temperature": 20}]'
      selector:
        object:
update_program:
  fields:
    program_id:
      required: true
      example: "casa"
      selector:
        text:
    name:
      selector:
        text:
    week:
      example: '[[{"start": "07:00", "end": "22:00", "mode": "heat", "temperature": 20.5}, {"start": "22:00", "end": "24:00", "mode": "heat", "preset": "sleep"}], [], [], [], [], [], []]'
      selector:
        object:
    holiday:
      example: '[{"start": "08:00", "end": "23:00", "mode": "heat", "temperature": 20}]'
      selector:
        object:
delete_program:
  fields:
    program_id:
      required: true
      example: "casa"
      selector:
        text:
assign:
  fields:
    program_id:
      required: true
      example: "casa"
      selector:
        text:
    climate_entity_id:
      required: true
      selector:
        entity:
          domain: climate
unassign:
  fields:
    climate_entity_id:
      required: true
      selector:
        entity:
          domain: climate
pause:
  fields:
    climate_entity_id:
      required: true
      selector:
        entity:
          domain: climate
resume:
  fields:
    climate_entity_id:
      required: true
      selector:
        entity:
          domain: climate
set_manual:
  fields:
    climate_entity_id:
      required: true
      selector:
        entity:
          domain: climate
    mode:
      required: true
      example: "heat"
      selector:
        select:
          options:
            - heat
            - cool
            - "off"
    temperature:
      example: 21
      selector:
        number:
          min: 5
          max: 35
          step: 0.5
          mode: box
    preset:
      example: "home"
      selector:
        text:
resume_auto:
  fields:
    climate_entity_id:
      required: true
      selector:
        entity:
          domain: climate
set_day:
  fields:
    climate_entity_id:
      required: true
      selector:
        entity:
          domain: climate
    day_kind:
      required: true
      example: "mon"
      selector:
        select:
          mode: dropdown
          options:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun
            - holiday
    bands:
      required: true
      example: "07:00-22:00 heat 20.5; 22:00-24:00 off"
      selector:
        text:
          multiline: true
    base_revision:
      required: false
      example: "a1b2c3d4e5f6"
      selector:
        text:
